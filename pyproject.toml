[build-system]
requires = ["uv_build>=0.9.10,<0.10"]
build-backend = "uv_build"

[project]
name = "guardrail-tuner"
version = "0.1.0"
description = "Inspect guardrail models and plan inference runtime checks"
requires-python = ">=3.10"

[project.optional-dependencies]
hub = ["huggingface-hub>=0.26"]
datasets = ["datasets>=3.0", "huggingface-hub>=0.26"]
inference = ["datasets>=3.0", "huggingface-hub>=0.26", "torch>=2.5,<2.9; python_version < '3.11'", "torch>=2.5; python_version >= '3.11'", "transformers>=4.50,<5", "optimum-onnx>=0.0.3,<1", "onnx>=1.16", "pyyaml>=6"]
inference-cpu = [
    "onnxruntime>=1.21,<1.24; python_version < '3.11'",
    "onnxruntime>=1.21; python_version >= '3.11'",
]
inference-cuda = [
    "onnxruntime-gpu>=1.21,<1.24; python_version < '3.11'",
    "onnxruntime-gpu>=1.21; python_version >= '3.11'",
]

[project.scripts]
guardrail-tuner = "guardrail_tuner.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "types-PyYAML>=6,<7",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*", "torch", "torch.*", "transformers", "transformers.*", "optimum", "optimum.*", "onnxruntime", "onnxruntime.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "inference-cpu" }, { extra = "inference-cuda" }]]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
