[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-tuner"
version = "0.1.0"
description = "Inspect guardrail models and plan inference runtime checks"
requires-python = ">=3.10"

[project.optional-dependencies]
hub = ["huggingface-hub>=0.26"]

[project.scripts]
guardrail-tuner = "guardrail_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
