name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.10"
      - name: Install dependencies
        run: uv sync --locked --extra hub --extra datasets --extra inference --extra inference-cpu
      - name: Lint and format
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .
      - name: Type check
        run: uv run --locked --no-sync mypy
      - name: Test
        run: uv run --locked --no-sync pytest
      - name: Build distributions
        run: uv build --out-dir /tmp/guardrail-dist
      - name: Test wheel installation
        run: |
          uv venv /tmp/guardrail-wheel-env --python "${{ matrix.python }}"
          uv pip install --python /tmp/guardrail-wheel-env/bin/python /tmp/guardrail-dist/*.whl
          cd /tmp
          /tmp/guardrail-wheel-env/bin/guardrail-tuner --help
