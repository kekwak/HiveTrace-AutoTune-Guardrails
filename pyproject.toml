[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-tuner"
version = "0.1.0"
description = "Inspect guardrail models and plan inference runtime checks"
requires-python = ">=3.10"

[project.optional-dependencies]
hub = ["huggingface-hub>=0.26"]
datasets = ["datasets>=3.0", "huggingface-hub>=0.26"]

[project.scripts]
guardrail-tuner = "guardrail_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
